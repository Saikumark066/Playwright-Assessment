name: Playwright CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      test_environment:
        description: Environment profile to test
        required: true
        default: demo
        type: choice
        options:
          - demo
          - dev
          - qa
          - stage

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Playwright shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.test_environment || 'demo' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: true
      TEST_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.test_environment || 'demo' }}
      BASE_URL: ${{ secrets.BASE_URL }}
      ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
      ESS_PASSWORD: ${{ secrets.ESS_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright shard
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Write shard summary
        if: always()
        run: node utils/write-test-summary.js
      - name: Upload shard reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-report-${{ matrix.shard }}
          path: |
            blob-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  merge-reports:
    name: Merge Playwright reports
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge HTML report
        if: hashFiles('all-blob-reports/*.zip') != ''
        run: npx playwright merge-reports --reporter html all-blob-reports
      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-merged-html-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
