name: Playwright CI

# Run CI for updates and proposed changes to the default branch; allow manual runs too.
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

# Give the workflow read-only repository access; tests do not need to write to GitHub.
permissions:
  contents: read

# Keep only the newest run for the same branch or pull request.
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # CI enables retries and a controlled worker count in playwright.config.js.
    # These secrets are optional; the app code falls back to the public demo URL and credentials.
    env:
      CI: true
      BASE_URL: ${{ secrets.BASE_URL }}
      USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
      PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}

    steps:
      # Fetch the source code for this commit or pull request.
      - name: Check out repository
        uses: actions/checkout@v4

      # Use a fixed Node version and cache npm downloads between workflow runs.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install exactly the dependency versions recorded in package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Install Chromium and its Linux libraries, matching the configured browser.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Run the Playwright test suite; a nonzero exit code fails this CI job.
      - name: Run tests
        run: npm test

      # Preserve reports and failure evidence even when tests fail.
      - name: Upload Playwright report and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-and-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
